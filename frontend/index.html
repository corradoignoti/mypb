<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MyPB &mdash; Carburanti</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="theme-color" content="#2563eb" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="MyPB" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
  />
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
</head>
<body>
  <header>
    <h1><img src="icon.svg" alt="" width="22" height="22" class="brand-icon" />MyPB</h1>
    <div class="api-base hidden">
      <label for="apiBase">API base</label>
      <input id="apiBase" type="text" value="http://127.0.0.1:5000" />
    </div>
    <a href="https://github.com/corradoignoti/mypb" target="_blank" rel="noopener" class="github-link" aria-label="Codice su GitHub" title="Codice su GitHub">
      <svg viewBox="0 0 16 16" width="22" height="22" aria-hidden="true">
        <path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z" />
      </svg>
    </a>
  </header>

  <div id="installBanner" class="install-banner hidden">
    <img src="icon-192.png" alt="" width="32" height="32" />
    <p id="installBannerText">Installa MyPB sul telefono per un accesso più rapido.</p>
    <button type="button" id="installBtn">Installa</button>
    <button type="button" id="installDismissBtn" class="install-dismiss" aria-label="Chiudi">&times;</button>
  </div>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="aroundme">Distributori</button>
    <button class="tab-btn" data-tab="gestore">Cerca gestore</button>
  </nav>

  <main>
    <section id="tab-aroundme" class="tab-panel active">
      <form id="aroundmeForm" class="form-row">
        <div class="field address-field">
          <label for="address">Indirizzo</label>
          <input id="address" type="text" placeholder="Via Roma 1, Palermo" autocomplete="off" />
          <ul id="addressSuggestions" class="address-suggestions hidden"></ul>
        </div>
        <div class="field advanced hidden">
          <label for="lat">Lat</label>
          <input id="lat" type="text" placeholder="37.333935" required />
        </div>
        <div class="field advanced hidden">
          <label for="lon">Lon</label>
          <input id="lon" type="text" placeholder="13.595533" required />
        </div>
        <button type="button" id="geoBtn" title="Usa la mia posizione">
          <svg class="target-icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="2" />
            <circle cx="12" cy="12" r="1.6" fill="currentColor" />
            <line x1="12" y1="1" x2="12" y2="4" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="12" y1="20" x2="12" y2="23" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="1" y1="12" x2="4" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="20" y1="12" x2="23" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          Usa posizione
        </button>

        <div class="field advanced hidden">
          <label for="radius">Raggio (km)</label>
          <input id="radius" type="number" value="2" min="0.1" step="0.1" />
        </div>
        <div class="field advanced hidden">
          <label for="sort">Ordina per</label>
          <select id="sort">
            <option value="alpha">Alfabetico</option>
            <option value="price" selected>Prezzo</option>
          </select>
        </div>
        <div class="field advanced hidden">
          <label for="order">Ordine</label>
          <select id="order">
            <option value="asc">Crescente</option>
            <option value="desc">Decrescente</option>
          </select>
        </div>
        <div class="field" id="fuelField">
          <label for="fuel">Carburante</label>
          <select id="fuel">
            <option value="Benzina">Benzina</option>
            <option value="Gasolio">Gasolio</option>
            <option value="GPL">GPL</option>
            <option value="Metano">Metano</option>
          </select>
        </div>
        <div class="field advanced hidden">
          <label for="self">Tipo</label>
          <select id="self">
            <option value="">Tutti</option>
            <option value="1">Self</option>
            <option value="0">Servito</option>
          </select>
        </div>

        <button type="submit">Cerca</button>
      </form>

      <button type="button" id="advancedToggle" class="advanced-toggle">Ricerca avanzata</button>

      <p id="aroundmeStatus" class="status"></p>

      <div class="view-toggle">
        <button type="button" class="view-btn active" data-view="table">Tabella</button>
        <button type="button" class="view-btn" data-view="map">Mappa</button>
      </div>

      <div class="wrap-x">
        <table id="aroundmeTable" class="results-table hidden">
          <thead>
            <tr>
              <th>#</th>
              <th>Bandiera</th>
              <th>Comune</th>
              <th>Distanza (km)</th>
              <th id="priceCol" class="hidden">Prezzo</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>

      <div id="aroundmeMap" class="map hidden"></div>
    </section>

    <section id="tab-gestore" class="tab-panel">
      <form id="gestoreForm" class="form-row">
        <div class="field">
          <label for="idImpianto">idImpianto</label>
          <input id="idImpianto" type="text" placeholder="59183" required />
        </div>
        <button type="submit">Cerca</button>
      </form>

      <p id="gestoreStatus" class="status"></p>

      <div id="gestoreDetail" class="detail hidden">
        <div id="gestoreInfo"></div>
        <div id="gestoreMap" class="map map-small"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>
      MyPB &middot; by <a href="https://github.com/corradoignoti" target="_blank" rel="noopener">Corrado Ignoti</a>
      &middot; Dati carburanti: <a href="https://www.mimit.gov.it/it/open-data/elenco-dataset/carburanti-prezzi-praticati-e-anagrafica-degli-impianti" target="_blank" rel="noopener">MIMIT</a>
      &middot; Mappe: <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">&copy; OpenStreetMap</a> contributors
      &middot; <a href="about.html">About</a>
      &middot; <a href="privacy.html">Privacy</a>
    </p>
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>

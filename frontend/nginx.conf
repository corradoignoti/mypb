# Replaces the nginx image's default.conf.
#
# No build step means no fingerprinted file names, so HTML/JS/CSS (and
# the PWA manifest/service worker) are sent with "no-cache": browsers and
# Cloudflare must revalidate (ETag -> 304) on every load instead of
# serving a stale copy after a deploy. Without an explicit header,
# Cloudflare applies its own 4h TTL.
server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;
    index        index.html;

    location / {
    }

    location ~* \.(html|js|css|webmanifest)$ {
        add_header Cache-Control "no-cache";
    }

    error_page   500 502 503 504  /50x.html;
}
